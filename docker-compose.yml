version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ai_support_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: support_ai_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
