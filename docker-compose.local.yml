services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_support_db
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["supportai-local-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_support_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["supportai-local-redis:/data"]

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      RUSTFS_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["supportai-local-rustfs:/data"]

  migrate:
    build:
      context: ./backend
      target: migrator
    entrypoint: []
    command: ["npm", "run", "db:migrate"]
    env_file: .env.local
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ai_support_db
      DATABASE_URL: postgresql://supportai_app:${DATABASE_APP_PASSWORD}@postgres:5432/ai_support_db
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    entrypoint: []
    command: ["node", "dist/index.js"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://supportai_app:${DATABASE_APP_PASSWORD}@postgres:5432/ai_support_db
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build: ./backend
    entrypoint: []
    command: ["node", "dist/worker.js"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://supportai_app:${DATABASE_APP_PASSWORD}@postgres:5432/ai_support_db
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: development
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]

volumes:
  supportai-local-pg:
  supportai-local-redis:
  supportai-local-rustfs:
