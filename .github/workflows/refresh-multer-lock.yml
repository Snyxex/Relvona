name: Refresh Multer Lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate lockfile only
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: refresh Multer 2.3.0 lockfile"
          git push origin HEAD:${{ github.head_ref }}
