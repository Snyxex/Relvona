name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Build, functional security tests, and dependency audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d support"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: backend
      - run: psql postgresql://postgres:postgres@localhost:5432/support -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: npm run db:migrate
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/support
          DATABASE_URL: postgresql://supportai_app:integration-password@localhost:5432/support
          DATABASE_APP_USER: supportai_app
          DATABASE_APP_PASSWORD: integration-password
      - run: npm run test:tenant-isolation
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/support
          DATABASE_URL: postgresql://supportai_app:integration-password@localhost:5432/support
      - run: node dist/tests/security.test.js
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      # Fail the merge on critical production vulnerabilities. High findings are
      # retained in the workflow output until they are remediated deliberately.
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
