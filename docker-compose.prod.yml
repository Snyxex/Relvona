services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redisdata:/data"]
    networks: [data]
  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 35s
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 8080
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
    expose: ["8080"]
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  migrate:
    build:
      context: ./backend
      target: migrator
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
    command: ["npm", "run", "db:migrate"]
    networks: [data]
  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 35s
    mem_limit: 1024m
    cpus: 1.5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
      INGESTION_WORKER_CONCURRENCY: ${INGESTION_WORKER_CONCURRENCY:-2}
    command: ["node", "dist/worker.js"]
    networks: [data]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    depends_on: [backend]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    expose: ["3000"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  pgdata:
  redisdata:
networks:
  edge:
    name: supportai-edge
  data:
    internal: true
