services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redisdata:/data"]
    networks: [data]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY to a strong uppercase alphanumeric access key}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY to a strong random secret}
      RUSTFS_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ["/data"]
    volumes: ["rustfsdata:/data"]
    expose: ["9000"]
    networks: [data]

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 35s
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      rustfs: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_REQUEST_POOL_MAX: ${DATABASE_REQUEST_POOL_MAX:-20}
      DATABASE_SCHEDULING_LOCK_POOL_MAX: ${DATABASE_SCHEDULING_LOCK_POOL_MAX:-2}
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_PROVIDER: rustfs
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      # Public HTTPS route to the same RustFS S3 API, e.g. https://objects.example.com.
      # It is used only to sign URLs returned to browsers.
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set public HTTPS RustFS endpoint}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-supportai}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      # Exact HTTPS dashboard/customer-portal origins allowed to use presigned browser uploads.
      OBJECT_STORAGE_CORS_ALLOWED_ORIGINS: ${OBJECT_STORAGE_CORS_ALLOWED_ORIGINS:?set comma-separated HTTPS frontend origins}
      # HTTP is permitted only because this endpoint is reachable exclusively on
      # Docker's isolated data network. The public signing endpoint must use HTTPS.
      OBJECT_STORAGE_ALLOW_INSECURE_HTTP: "true"
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
    expose: ["8080"]
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: migrator
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
    command: ["npm", "run", "db:migrate"]
    networks: [data]

  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 35s
    mem_limit: 1024m
    cpus: 1.5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      rustfs: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      DATABASE_POOL_MAX: ${DATABASE_WORKER_POOL_MAX:-10}
      DATABASE_REQUEST_POOL_MAX: ${DATABASE_WORKER_REQUEST_POOL_MAX:-1}
      DATABASE_SCHEDULING_LOCK_POOL_MAX: ${DATABASE_SCHEDULING_LOCK_POOL_MAX:-2}
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_PROVIDER: rustfs
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set public HTTPS RustFS endpoint}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-supportai}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      OBJECT_STORAGE_CORS_ALLOWED_ORIGINS: ${OBJECT_STORAGE_CORS_ALLOWED_ORIGINS:?set comma-separated HTTPS frontend origins}
      OBJECT_STORAGE_ALLOW_INSECURE_HTTP: "true"
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?authenticate with Infisical before deployment}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?set the Infisical project id}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-production}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
      INGESTION_WORKER_CONCURRENCY: ${INGESTION_WORKER_CONCURRENCY:-2}
    command: ["node", "dist/worker.js"]
    networks: [data]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    depends_on: [backend]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    expose: ["3000"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  rustfsdata:

networks:
  edge:
    name: supportai-edge
  data:
    internal: true
